<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>女声音色 · 三模型试听</title>
<style>
:root{color-scheme:light;--ink:#24352c;--muted:#738075;--line:#dfe5da;--green:#526f58}*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.7}main{max-width:1280px;margin:auto;padding:38px 30px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green)}h1{font-size:32px;margin:10px 0}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}a{color:var(--green)}button,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#edf2e9}.primary{background:var(--green);color:white}.primary:hover{background:#3c5942}label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:14px;background:white;padding:22px;border:1px solid var(--line);border-radius:12px;margin:26px 0 16px}.controls label:first-child{flex:1;min-width:180px}.check{flex-direction:row;align-items:center;padding:8px 0;color:var(--ink)}input{accent-color:var(--green)}.quote{font-size:19px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:22px 0}article{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}article.playing{outline:2px solid var(--green)}h2{font-size:20px;margin:10px 0}.tag{font-size:11px;color:var(--muted);letter-spacing:1px}audio{width:100%;margin:18px 0 8px;height:38px}.links{display:flex;gap:16px;font-size:12px;margin-top:14px}details{background:#eef1e8;border-radius:9px;padding:14px 18px;margin-top:16px}summary{cursor:pointer;font-size:13px}#reference-player{max-width:430px;display:block}footer{border-top:1px solid var(--line);padding-top:18px;margin-top:28px}#now{min-height:24px;color:var(--green);font-size:13px}@media(max-width:850px){.grid{grid-template-columns:1fr}header{display:block}main{padding:24px 18px}h1{font-size:26px}.quote{font-size:17px}.controls{padding:16px}select{max-width:100%}}
</style>
<main><header><div><div class="eyebrow">VOICE CLONE STUDY / LOCAL AUDIO</div><h1>同一个声音，九种表达。</h1><p class="muted" id="summary"></p></div><a id="live" href="http://127.0.0.1:8765/compare">打开工作台评分 ↗</a></header>
<div class="controls"><label>参考片段<select id="reference"></select></label><label>语气<select id="mood"></select></label><button id="next">下一种语气 →</button><button id="play" class="primary">依次播放当前组</button><button id="stop">暂停</button><label class="check"><input type="checkbox" id="blind">隐藏模型</label><label class="check"><input type="checkbox" id="original">原始响度</label><button id="shuffle">打乱顺序</button></div>
<p class="quote" id="text"></p><p id="now" aria-live="polite">选一组，听听三个模型的区别。</p><details><summary id="reference-title">试听原始参考</summary><audio id="reference-player" controls preload="none"></audio><p class="muted" id="transcript"></p></details><div id="results" class="grid"></div>
<footer class="muted">默认播放 −16 LUFS 统一响度版本。勾选「原始响度」可听原始 WAV。<br>同名语气表示共同演绎意图，三个模型的控制参数并不等价。音色相似度、自然度及语气强度请实际试听判断，未填写主观评分。<br>本包音频保存在本机；双击此网页即可试听，无需启动模型服务。自动转写仅辅助查漏字、复读，可能识别错误。</footer></main>
<script id="study-data" type="application/json">__STUDY_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('study-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let order=[];
$('summary').textContent=`${data.references.length} 段参考 × 3 个模型 × ${data.moods.length} 种语气 · ${data.results.length} 条真实生成`;
$('text').textContent='“'+data.text+'”';$('live').href=data.live_url;
$('reference').innerHTML=data.references.map(r=>`<option value="${r.id}">${esc(r.code)} · ${r.duration.toFixed(1)} 秒</option>`).join('');
$('mood').innerHTML=data.moods.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')+'<option value="all">全部语气 · 27 条</option>';
function pauseAll(){document.querySelectorAll('audio').forEach(a=>a.pause());}
function render(){pauseAll();const ref=data.references.find(r=>r.id===$('reference').value),mood=$('mood').value;
 const rows=data.results.filter(r=>r.reference_id===ref.id&&(mood==='all'||r.emotion===mood));
 if(order.length!==rows.length||order.some(id=>!rows.some(r=>r.id===id)))order=rows.map(r=>r.id);
 $('reference-title').textContent=`试听原始参考 · ${ref.code} · ${ref.duration.toFixed(1)} 秒`;$('reference-player').src=ref.audio;$('transcript').textContent=ref.transcript;
 $('results').innerHTML=order.map((id,i)=>{const r=rows.find(r=>r.id===id);return `<article data-id="${r.id}"><span class="tag">${esc(ref.code)} / ${esc(r.emotion_name)} / TAKE ${String(i+1).padStart(2,'0')}</span><h2>${$('blind').checked?'声音 '+(i+1):esc(r.engine_name)}</h2><p class="muted">${r.duration.toFixed(2)} 秒 · ${$('original').checked?'原始响度':'统一响度'}</p><audio controls preload="none" class="take" src="${esc($('original').checked?r.original:r.mp3)}" aria-label="试听声音 ${i+1}"></audio>${r.duplicate_moods.length?'<p class="muted">与同模型「'+esc(r.duplicate_moods.join('、'))+'」结果的音频完全相同。</p>':''}${r.diagnostic_cer>.12?'<p class="muted">自动转写提示可能有文字差异，请结合原文试听。</p>':''}<div class="links"><a href="${esc(r.original)}" download>原始 WAV ↓</a><a href="${esc(r.matched)}" download>统一响度 WAV ↓</a><a href="${esc(r.mp3)}" download>MP3 ↓</a></div></article>`;}).join('');
 document.querySelectorAll('audio').forEach(a=>a.onplay=()=>{document.querySelectorAll('audio').forEach(b=>{if(a!==b)b.pause();});document.querySelectorAll('article').forEach(c=>c.classList.toggle('playing',c.contains(a)));if(a.classList.contains('take')){const r=rows.find(r=>r.id===a.closest('article').dataset.id);$('now').textContent=`正在试听：${ref.code} · ${r.emotion_name} · ${$('blind').checked?'声音 '+(order.indexOf(r.id)+1):r.engine_name}`;}});
 $('now').textContent=`当前 ${rows.length} 条 · 点击单条播放，或依次播放当前组。`;
}
for(const id of ['reference','mood','blind','original'])$(id).onchange=()=>{order=[];render();};
$('next').onclick=()=>{const i=data.moods.findIndex(m=>m.id===$('mood').value);$('mood').value=data.moods[(i+1)%data.moods.length].id;order=[];render();};
$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const x=new Uint32Array(1);crypto.getRandomValues(x);const j=x[0]%(i+1);[order[i],order[j]]=[order[j],order[i]];}render();};
$('stop').onclick=pauseAll;
$('play').onclick=()=>{pauseAll();const list=[...document.querySelectorAll('.take')];list.forEach((a,i)=>a.onended=()=>{if(list[i+1])list[i+1].play().catch(()=>$('now').textContent='浏览器暂停了连续播放，请点击下一条。');else $('now').textContent='本组已播放完毕。';});if(list[0]){list[0].currentTime=0;list[0].play().catch(()=>$('now').textContent='请点击音频播放器开始试听。');}};
render();
</script></html>
