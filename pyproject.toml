[project]
name = "tts-lab"
version = "0.1.0"
description = "Local voice generation and reproducible listening experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18",
  "numpy>=2,<3",
  "soundfile>=0.13,<1",
  "huggingface-hub>=0.34,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
